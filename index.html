<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARK ASA 生物ドラフト</title><style>body{font-family:system-ui,sans-serif;background:#101a22;color:#e8f1f5;margin:0}header,main{max-width:1000px;margin:auto;padding:24px}header{border-bottom:1px solid #456}h1{margin:0}button,input,select{font:inherit;padding:9px;border-radius:7px}button{cursor:pointer;background:#18a999;color:#061b1b;border:0}input,select{background:#263640;color:white;border:1px solid #678}section{background:#1b2a35;padding:18px;margin:16px 0;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.card{background:#293b47;padding:12px;border-radius:8px}.card button{margin:4px}.muted{color:#b6c4cb}#notice{white-space:pre-wrap}label{display:block;margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#catalog{max-height:550px;overflow:auto}</style></head><body><header><h1>ARK ASA 生物ドラフト</h1><p class="muted">チーム予算：50ポイント / 生物は複数選択可能</p></header><main><section><div class="row"><input id="search" placeholder="生物名で検索"><select id="category"><option value="">すべての分類</option></select></div><p id="notice" role="status"></p><div id="catalog" class="grid"></div></section><section><h2>選択中の生物</h2><h3 id="total">0 / 50 ポイント</h3><div id="selected"></div><label>チーム名 <input id="team" maxlength="60" placeholder="チーム名を入力"></label><button id="submit">編成を提出</button><p class="muted">提出内容は管理者のみ閲覧できます。</p></section><section><h2>管理者</h2><div class="row"><input type="password" id="password" placeholder="管理者パスワード"><button id="login">ログイン</button><button id="logout">ログアウト</button><button id="submissions">提出内容を見る</button></div><p id="adminstatus"></p><div id="adminlist"></div></section></main><script src="/app.js"></script></body></html>
