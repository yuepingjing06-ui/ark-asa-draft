<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARK ASA 生物ドラフト</title>
<link rel="stylesheet" href="/style.css"></head><body>
<div class="sticky-tools"><div id="sticky-points" class="point-chip" aria-live="polite">使用 0 / 50pt<br>残り 50pt</div><button id="list-toggle" class="list-toggle" aria-label="選択中の生物を表示" aria-expanded="false" aria-controls="list-panel">☷</button></div>
<div id="list-panel" class="list-panel" hidden><h2>選択中の生物</h2><div id="quick-selected"></div></div>
<header><h1>ARK ASA 生物ドラフト</h1><p class="muted">チーム予算：50ポイント / 生物は複数選択可能</p></header>
<main><section><div class="row"><input id="search" placeholder="生物名で検索" aria-label="生物名で検索"><select id="category"><option value="">すべての分類</option></select></div><p id="notice" role="status"></p><div id="catalog" class="grid"></div></section>
<section><h2>選択中の生物</h2><h3 id="total">0 / 50 ポイント</h3><div id="selected"></div><label>チーム名 <input id="team" maxlength="60" placeholder="チーム名を入力"></label><button id="submit">編成を提出</button><p class="muted">提出内容は管理者のみ閲覧できます。</p></section>
<section><h2>管理者</h2><div class="row"><input type="password" id="password" placeholder="管理者パスワード"><button id="login">ログイン</button><button id="logout">ログアウト</button><button id="submissions">提出内容を見る</button></div><p id="adminstatus"></p><div id="adminlist"></div></section></main><script src="/app.js"></script></body></html>
