<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARK ASA 生物ドラフト</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#fff;color:#17212b;margin:0}header,main{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #d9e0e5}h1{margin:0}button,input,select{font:inherit;padding:10px;border-radius:8px}button{cursor:pointer;background:#087d73;color:#fff;border:0}button:disabled{opacity:.5;cursor:not-allowed}input,select{background:white;color:#17212b;border:1px solid #aab8c2}section{background:#fff;border:1px solid #e0e5e9;padding:20px;margin:18px 0;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:960px;margin:0 auto}.card{background:#fff;border:1px solid #d9e0e5;padding:16px 10px;border-radius:10px;text-align:center;min-width:0}.card button{margin:4px}.card strong{overflow-wrap:anywhere}.muted{color:#596773}#notice{white-space:pre-wrap}label{display:block;margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#search{width:min(100%,440px);min-height:48px;font-size:18px}#catalog{max-height:none;overflow:visible}.name-p1{color:#111}.name-p2{color:#15803d}.name-p3{color:#1d4ed8}.name-p4{color:#7e22ce}.name-p5{color:#947000}.name-rainbow{background:linear-gradient(90deg,#e53935,#f59e0b,#d4a600,#169b62,#2374e1,#9333ea);background-clip:text;-webkit-background-clip:text;color:transparent}.sticky-tools{position:fixed;top:14px;right:18px;z-index:20;display:flex;gap:8px;align-items:center}.point-chip,.list-toggle{background:#fff;color:#17212b;border:1px solid #cbd5dc;box-shadow:0 3px 12px #0002;border-radius:10px;padding:10px 14px}.point-chip{font-weight:700;line-height:1.5}.point-chip.over{color:#b42318;border-color:#b42318}.list-toggle{font-size:22px;min-width:48px}.list-panel{position:fixed;top:90px;right:18px;z-index:21;width:min(390px,calc(100vw - 36px));max-height:65vh;overflow:auto;background:white;border:1px solid #cbd5dc;border-radius:12px;padding:16px;box-shadow:0 8px 30px #0002}.list-panel[hidden]{display:none}.list-panel h2{margin-top:0}.selected-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #e0e5e9;padding:9px 0}.selected-entry span{overflow-wrap:anywhere}.selected-entry button{min-width:38px}.selection-actions{display:flex;gap:5px;flex-shrink:0}.card p{margin:10px 0}@media(max-width:650px){header{padding-top:85px}header,main{padding-left:12px;padding-right:12px}.grid{gap:6px}.card{padding:10px 4px;font-size:13px}.card button{padding:7px}.sticky-tools{top:8px;right:8px}.point-chip{font-size:12px;padding:6px 8px}.list-toggle{padding:6px 9px}.list-panel{top:65px;right:8px}section{padding:12px}}
</style></head><body>
<div class="sticky-tools"><div id="sticky-points" class="point-chip" aria-live="polite">使用 0 / 50pt<br>残り 50pt</div><button id="list-toggle" class="list-toggle" aria-label="選択中の生物を表示" aria-expanded="false" aria-controls="list-panel">☷</button></div>
<div id="list-panel" class="list-panel" hidden><h2>選択中の生物</h2><div id="quick-selected"></div></div>
<header><h1>ARK ASA 生物ドラフト</h1><p class="muted">チーム予算：50ポイント / 生物は複数選択可能</p></header>
<main><section><div class="row"><input id="search" placeholder="生物名で検索" aria-label="生物名で検索"><select id="category"><option value="">すべての分類</option></select></div><p id="notice" role="status"></p><div id="catalog" class="grid"></div></section>
<section><h2>選択中の生物</h2><h3 id="total">0 / 50 ポイント</h3><div id="selected"></div><label>チーム名 <input id="team" maxlength="60" placeholder="チーム名を入力"></label><button id="submit">編成を提出</button><p class="muted">提出内容は管理者のみ閲覧できます。</p></section>
<section><h2>管理者</h2><div class="row"><input type="password" id="password" placeholder="管理者パスワード"><button id="login">ログイン</button><button id="logout">ログアウト</button><button id="submissions">提出内容を見る</button></div><p id="adminstatus"></p><div id="adminlist"></div></section></main><script src="/app.js"></script></body></html>
